<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>主力洗盘 · 拉升前夜 · 策略看板</title>
<!--
  ═══════════════════════════════════════════════════════════════════
  数据源：stockdb 本地库  127.0.0.1:7899
  协议（原生 HTTP，无需 SDK 授权）：
    GET /?cmd=get&t=日k:600633:20260625&json=1          → 单条 dict
    GET /?cmd=vals&t=日k:600633:2026062*&json=1         → 同代码多日数组
    GET /?cmd=vals&t=日k:000001,000002:20260625&json=1  → 逗号批量（≤50 代码）
    GET /?cmd=keys&t=日k:600633:2026*&json=1            → 键名数组
  注意：代码位通配(*) 与「逗号批量+日期通配」不被支持。
  ═══════════════════════════════════════════════════════════════════
-->
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2430; --line:#2d3644; --line2:#3d4859;
    --text:#e6edf3; --muted:#8b98a9; --brand:#3d8bfd; --brand2:#1f6feb;
    --up:#ff4d4f; --down:#3fb950; --warn:#d29922; --ok:#3fb950;
    --gold:#e3b341; --shadow:0 16px 42px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;background:var(--bg);color:var(--text);
    font-family:"Microsoft YaHei","Segoe UI",system-ui,sans-serif;font-size:14px;
  }
  .app{width:min(1560px,calc(100vw - 28px));margin:20px auto}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
  h1{margin:0;font-size:21px;letter-spacing:.03em}
  h1 small{color:var(--muted);font-size:13px;font-weight:400;margin-left:10px}
  .status{color:var(--muted);font-size:12px;font-family:Consolas,monospace}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:middle}
  .dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .dot.off{background:var(--up)}

  /* 条件卡 */
  .conds{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
  .cond{
    border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--panel);
    cursor:pointer;transition:.18s;position:relative;overflow:hidden;
  }
  .cond:hover{border-color:var(--brand);transform:translateY(-2px)}
  .cond.active{border-color:var(--brand);background:linear-gradient(160deg,#1a2a44,#161b22);box-shadow:0 0 0 1px var(--brand) inset}
  .cond .tag{font-family:Consolas,monospace;font-size:11px;color:var(--brand);font-weight:700;letter-spacing:.1em}
  .cond .txt{margin:7px 0 9px;font-size:13px;line-height:1.55;color:var(--text)}
  .cond .n{font-size:26px;font-weight:800;font-family:Consolas,monospace}
  .cond .n span{font-size:12px;color:var(--muted);font-weight:400;margin-left:5px}
  .cond .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--brand);transition:.3s}

  /* 工具条 */
  .toolbar{
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;
    padding:12px 14px;border:1px solid var(--line);border-radius:13px;background:var(--panel);
    box-shadow:var(--shadow);position:sticky;top:10px;z-index:20;margin-bottom:12px;
  }
  input,select{
    height:34px;border:1px solid var(--line2);border-radius:9px;padding:0 10px;
    background:#0b1017;color:var(--text);font-size:13px;outline:none;font-family:inherit;
  }
  input:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(61,139,253,.15)}
  #q{width:200px}
  button{
    height:34px;border:0;border-radius:9px;padding:0 15px;background:var(--brand2);color:#fff;
    font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;
  }
  button:hover{background:var(--brand)}
  button.ghost{background:#21262d;border:1px solid var(--line2)}
  button.ghost:hover{background:#2d333b}
  button:disabled{opacity:.5;cursor:not-allowed}
  .spacer{flex:1}
  .seg{display:flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
  .seg button{border-radius:0;background:#0b1017;color:var(--muted);font-weight:600;padding:0 13px}
  .seg button.on{background:var(--brand2);color:#fff}

  /* 统计条 */
  .stats{display:flex;gap:22px;flex-wrap:wrap;margin:0 0 12px;padding:0 4px;color:var(--muted);font-size:12.5px}
  .stats b{color:var(--text);font-family:Consolas,monospace;font-size:14px}

  /* 表 */
  .sheet{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:var(--panel);box-shadow:var(--shadow)}
  .wrap{width:100%;overflow:auto;max-height:calc(100vh - 300px)}
  table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;white-space:nowrap}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
  thead th{
    position:sticky;top:0;z-index:3;background:#1b222c;color:#a9b6c6;font-weight:700;
    border-bottom:1px solid var(--line2);font-size:11.5px;letter-spacing:.03em;cursor:pointer;user-select:none;
  }
  thead th:hover{color:var(--brand)}
  thead th.sorted::after{content:" ▾";color:var(--brand)}
  thead th.sorted.asc::after{content:" ▴"}
  tbody tr:hover td{background:#1e2733}
  tbody tr{cursor:pointer}
  td.code{font-family:Consolas,monospace;font-weight:700;color:#9cc4ff}
  td.name{font-weight:600}
  td.num{font-family:Consolas,monospace;text-align:right}
  .up{color:var(--up)} .down{color:var(--down)}
  .badge{
    display:inline-block;padding:1px 7px;border-radius:6px;font-size:10.5px;font-weight:800;
    font-family:Consolas,monospace;margin-right:3px;
  }
  .b-C1{background:rgba(61,139,253,.18);color:#7cb0ff;border:1px solid rgba(61,139,253,.4)}
  .b-C2{background:rgba(210,153,34,.18);color:#e3b341;border:1px solid rgba(210,153,34,.4)}
  .b-C3{background:rgba(163,113,247,.18);color:#c09bff;border:1px solid rgba(163,113,247,.4)}
  .pill{
    display:inline-block;min-width:44px;text-align:center;padding:2px 7px;border-radius:20px;
    font-weight:800;font-family:Consolas,monospace;font-size:11.5px;
  }
  .s-hi{background:rgba(255,77,79,.16);color:#ff7b7d}
  .s-mid{background:rgba(210,153,34,.16);color:#e3b341}
  .s-lo{background:rgba(139,152,169,.14);color:#a9b6c6}
  .minibar{height:5px;border-radius:3px;background:#232c38;overflow:hidden;display:inline-block;width:56px;vertical-align:middle;margin-right:6px}
  .minibar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand2),var(--brand))}
  .chipbar i{background:linear-gradient(90deg,#8957e5,#c09bff)}
  .empty{padding:52px;text-align:center;color:var(--muted)}
  .hint{color:var(--muted);font-size:12px}
  #msg{padding:9px 4px;font-size:12.5px;color:var(--muted);min-height:20px}
  #msg.err{color:var(--up)} #msg.ok{color:var(--ok)}

  /* 抽屉 */
  .drawer{
    position:fixed;top:0;right:0;width:min(520px,92vw);height:100vh;background:var(--panel);
    border-left:1px solid var(--line2);box-shadow:-20px 0 50px rgba(0,0,0,.6);
    transform:translateX(102%);transition:.28s cubic-bezier(.4,0,.2,1);z-index:60;display:flex;flex-direction:column;
  }
  .drawer.open{transform:translateX(0)}
  .dh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .dh h2{margin:0;font-size:17px}
  .dh .x{cursor:pointer;color:var(--muted);font-size:22px;line-height:1;padding:0 4px}
  .dh .x:hover{color:var(--up)}
  .db{padding:18px 20px;overflow:auto;flex:1}
  .kv{display:grid;grid-template-columns:104px 1fr;gap:9px 12px;margin-bottom:20px;font-size:13px}
  .kv .k{color:var(--muted)}
  .kv .v{font-family:Consolas,monospace}
  .sec-t{font-size:12px;color:var(--muted);letter-spacing:.08em;font-weight:700;margin:20px 0 10px;border-top:1px solid var(--line);padding-top:14px}
  #spark{width:100%;height:170px;background:#0b1017;border:1px solid var(--line);border-radius:10px;display:block}
  .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .m{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px}
  .m .l{font-size:11px;color:var(--muted);margin-bottom:4px}
  .m .n2{font-size:17px;font-weight:800;font-family:Consolas,monospace}
  .wparts{display:flex;flex-direction:column;gap:7px;margin-top:8px}
  .wp{display:grid;grid-template-columns:78px 1fr 34px;gap:9px;align-items:center;font-size:12px}
  .wp .lb{color:var(--muted)}
  .wp .bg{height:6px;background:#232c38;border-radius:3px;overflow:hidden}
  .wp .bg i{display:block;height:100%;background:var(--ok)}
  footer{margin:18px 4px;color:var(--muted);font-size:11.5px;line-height:1.7}
  footer code{background:#161b22;padding:1px 5px;border-radius:4px;font-size:11px;color:#9cc4ff}
  @media(max-width:1000px){
    .conds{grid-template-columns:1fr}
    .wrap{max-height:none}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>主力洗盘 · 拉升前夜 <small>三条件共振选股</small></h1>
    <div class="status"><span id="dot" class="dot"></span><span id="stat">初始化…</span></div>
  </header>

  <section class="conds" id="conds"></section>

  <div class="toolbar">
    <input id="q" placeholder="搜索代码 / 名称…" autocomplete="off" />
    <select id="reson">
      <option value="0">全部共振</option>
      <option value="2">仅双条件共振</option>
      <option value="1">仅单条件</option>
    </select>
    <select id="mkt">
      <option value="0">全部市值</option>
      <option value="1">&lt; 30 亿</option>
      <option value="2">30 ~ 100 亿</option>
      <option value="3">&gt; 100 亿</option>
    </select>
    <div class="seg" id="srcSeg">
      <button data-src="local" class="on">离线结果集</button>
      <button data-src="live">实时重算</button>
    </div>
    <div class="spacer"></div>
    <button class="ghost" id="csvBtn">导出 CSV</button>
    <button id="reloadBtn">重新加载</button>
  </div>

  <div class="stats" id="stats"></div>
  <div id="msg"></div>

  <section class="sheet">
    <div class="wrap" id="tableWrap">
      <div class="empty">正在加载策略结果…</div>
    </div>
  </section>

  <footer>
    数据源：<code>stockdb 7899</code> 本地库 ·
    协议：<code>GET /?cmd=vals&t=日k:代码:日期&json=1</code> ·
    获利筹码为<b>成交量加权近似估算</b>（真实筹码分布需逐日换手衰减模型，本地数据不具备），
    仅用于<b>相对排序</b>，不宜作为绝对判据。<br>
    策略条件：①连续3日上涨且累计≤7%、获利筹码≥70% ②2日换手率和前100、获利筹码≥70%
    ③90交易日内≥3次涨停、上市&gt;30天、获利筹码≥80%、排除ST。已剔除 ETF/LOF/REIT/可转债。
  </footer>
</div>

<!-- 详情抽屉 -->
<aside class="drawer" id="drawer">
  <div class="dh">
    <h2 id="dTitle">—</h2>
    <span class="x" id="dClose">×</span>
  </div>
  <div class="db" id="dBody"></div>
</aside>

<script src="./result.json.js"></script>
<script>
(function(){
'use strict';
const RESULT = window.STRATEGY_RESULT || null;
if(!RESULT){ document.getElementById('tableWrap').innerHTML='<div class="empty">缺少 result.json.js（请先运行 screen.js 生成）</div>'; return; }
const META = RESULT.meta;
const BASE = 'http://127.0.0.1:7899';

/* ── 状态 ── */
const S = {
  source:'local',        // local | live
  cond:'',               // '' | C1 | C2 | C3
  reson:'0',
  mkt:'0',
  q:'',
  sortKey:'score',
  sortAsc:false,
  rows:[],               // 当前展示（合并后的 combined）
  live:null,             // 实时重算缓存
  kline:{},              // 代码 -> 日K（抽屉用）
};

const condDefs = [
  {key:'C1', short:'条件一', txt:'连续 3 日上涨，累计涨幅 ≤ 7%，获利筹码 ≥ 70%',
   n:RESULT.conditions.cond1.hits.length, color:'#3d8bfd'},
  {key:'C2', short:'条件二', txt:'2 日换手率之和全市场前 100 名，获利筹码 ≥ 70%',
   n:RESULT.conditions.cond2.hits.length, color:'#e3b341'},
  {key:'C3', short:'条件三', txt:'90 交易日内 ≥ 3 次涨停，上市 > 30 天，获利筹码 ≥ 80%，排除 ST',
   n:RESULT.conditions.cond3.hits.length, color:'#a371f7'},
];

/* ── 渲染条件卡 ── */
(function renderConds(){
  const host = document.getElementById('conds');
  const max = Math.max(...condDefs.map(c=>c.n)) || 1;
  host.innerHTML = condDefs.map(c=>`
    <div class="cond" data-cond="${c.key}">
      <div class="tag" style="color:${c.color}">${c.short} · ${c.key}</div>
      <div class="txt">${c.txt}</div>
      <div class="n" style="color:${c.color}">${c.n}<span>只命中</span></div>
      <div class="bar" style="width:${(c.n/max*100).toFixed(1)}%;background:${c.color}"></div>
    </div>`).join('');
  host.querySelectorAll('.cond').forEach(el=>{
    el.addEventListener('click',()=>{
      const k = el.dataset.cond;
      S.cond = (S.cond===k) ? '' : k;
      host.querySelectorAll('.cond').forEach(x=>x.classList.toggle('active', x.dataset.cond===S.cond));
      render();
    });
  });
})();

/* ── 数据装配 ── */
function baseRows(){
  const seen = new Map();
  for(const c of ['cond1','cond2','cond3']){
    const kk = c==='cond1'?'C1':c==='cond2'?'C2':'C3';
    for(const h of RESULT.conditions[c].hits){
      if(!seen.has(h.code)) seen.set(h.code,{code:h.code,name:h.name,close:h.close,date:h.date,
        tags:[],chip:0,fmv亿:null,toRank:null,turnover2:null,limitUps:null,gain3:null});
      const o = seen.get(h.code);
      if(!o.tags.includes(kk)) o.tags.push(kk);
      if(h.chip>o.chip) o.chip=h.chip;
      if(h.fmv亿!=null) o.fmv亿=h.fmv亿;
      if(h.rank!=null){o.toRank=h.rank;o.turnover2=h.turnover2;}
      if(h.limitUps!=null) o.limitUps=h.limitUps;
      if(h.gain3!=null) o.gain3=h.gain3;
    }
  }
  // 并入综合分（combined 才有 score / wash 等）
  const sc = new Map(RESULT.combined.map(r=>[r.code,r]));
  const out=[];
  for(const o of seen.values()){
    const c = sc.get(o.code) || {};
    out.push({...o, score:c.score ?? 0, washScore:c.washScore ?? 0, concScore:c.concScore ?? 0,
      actScore:c.actScore ?? 0, wash:c.wash ?? null, reson:c.tags?c.tags.length:o.tags.length});
  }
  return out;
}

/* ── 过滤 + 排序 ── */
function applyFilter(rows){
  const q = S.q.trim().toLowerCase();
  return rows.filter(r=>{
    if(S.cond && !r.tags.includes(S.cond)) return false;
    if(S.reson!=='0' && String(r.tags.length)!==S.reson) return false;
    if(S.mkt!=='0'){
      const f = r.fmv亿;
      if(f==null) return false;
      if(S.mkt==='1' && !(f<30)) return false;
      if(S.mkt==='2' && !(f>=30&&f<=100)) return false;
      if(S.mkt==='3' && !(f>100)) return false;
    }
    if(q && !(r.code.includes(q) || String(r.name).toLowerCase().includes(q))) return false;
    return true;
  });
}
function applySort(rows){
  const k = S.sortKey, d = S.sortAsc?1:-1;
  const get = r=>{
    if(k==='tags') return r.tags.length;
    if(k==='wash') return r.washScore;
    if(k==='chip') return r.chip;
    const v = r[k]; return (v==null||v==='')?-Infinity:v;
  };
  return rows.slice().sort((a,b)=>{
    const x=get(a),y=get(b);
    if(typeof x==='string'||typeof y==='string') return String(x).localeCompare(String(y))*d;
    return (x-y)*d;
  });
}

/* ── 表格渲染 ── */
const COLS = [
  {k:'code',    t:'代码',      cls:'code'},
  {k:'name',    t:'名称',      cls:'name'},
  {k:'close',   t:'收盘',      cls:'num', fmt:v=>v==null?'':Number(v).toFixed(2)},
  {k:'tags',    t:'共振',      raw:true},
  {k:'score',   t:'综合分',    cls:'num', raw:true},
  {k:'wash',    t:'洗盘形态',  raw:true},
  {k:'chip',    t:'获利筹码',  raw:true},
  {k:'gain3',   t:'3日累涨',   cls:'num', fmt:v=>v==null?'—':`<span class="${v>=0?'up':'down'}">${v>=0?'+':''}${v}%</span>`},
  {k:'turnover2',t:'2日换手',  cls:'num', fmt:v=>v==null?'—':v+'%'},
  {k:'toRank',  t:'换手排名',  cls:'num', fmt:v=>v==null?'—':'#'+v},
  {k:'limitUps',t:'90日涨停',  cls:'num', fmt:v=>v==null?'—':v+' 次'},
  {k:'fmv亿',   t:'流通市值',  cls:'num', fmt:v=>v==null?'—':v+' 亿'},
];

function render(){
  const rows = applySort(applyFilter(S.source==='live'&&S.live ? S.live : baseRows()));
  S.rows = rows;

  // 统计
  document.getElementById('stats').innerHTML =
    `交易日 <b>${META.tradeDate}</b>` +
    ` · 股票池 <b>${META.universe}</b>` +
    ` · 命中 <b>${rows.length}</b> 只` +
    ` · 双共振以上 <b>${rows.filter(r=>r.tags.length>=2).length}</b>` +
    (S.source==='live'?' · <b style="color:var(--warn)">实时重算</b>':'');

  const wrap = document.getElementById('tableWrap');
  if(!rows.length){ wrap.innerHTML='<div class="empty">没有符合条件的标的。试着放宽筛选。</div>'; return; }

  const th = COLS.map(c=>{
    const sorted = S.sortKey===c.k;
    return `<th data-k="${c.k}" class="${sorted?'sorted':''}${sorted&&S.sortAsc?' asc':''}">${c.t}</th>`;
  }).join('');

  const tb = rows.map(r=>{
    const tds = COLS.map(c=>{
      if(c.k==='tags') return `<td>${r.tags.map(t=>`<span class="badge b-${t}">${t}</span>`).join('')}</td>`;
      if(c.k==='score'){
        const cls = r.score>=55?'s-hi':r.score>=40?'s-mid':'s-lo';
        return `<td class="num"><span class="pill ${cls}">${r.score}</span></td>`;
      }
      if(c.k==='wash')
        return `<td><span class="minibar"><i style="width:${Math.min(100,r.washScore)}%"></i></span>${r.washScore}</td>`;
      if(c.k==='chip')
        return `<td><span class="minibar chipbar"><i style="width:${Math.min(100,r.chip)}%"></i></span>${r.chip}%</td>`;
      const v = c.fmt ? c.fmt(r[c.k]) : (r[c.k]??'');
      return `<td class="${c.cls||''}">${v}</td>`;
    }).join('');
    return `<tr data-code="${r.code}">${tds}</tr>`;
  }).join('');

  wrap.innerHTML = `<table><thead><tr>${th}</tr></thead><tbody>${tb}</tbody></table>`;

  wrap.querySelectorAll('thead th').forEach(el=>{
    el.addEventListener('click',()=>{
      const k = el.dataset.k;
      if(S.sortKey===k) S.sortAsc=!S.sortAsc; else {S.sortKey=k;S.sortAsc=false;}
      render();
    });
  });
  wrap.querySelectorAll('tbody tr').forEach(el=>{
    el.addEventListener('click',()=>openDrawer(el.dataset.code));
  });
}

/* ── 迷你走势 ── */
function sparkline(rows, w, h){
  if(!rows||rows.length<2) return '';
  const cl = rows.map(r=>r.c);
  const mn = Math.min(...cl), mx = Math.max(...cl), pad = (mx-mn)*0.08 || 0.01;
  const lo = mn-pad, hi = mx+pad;
  const X = i => (i/(rows.length-1))*w;
  const Y = v => h - ((v-lo)/(hi-lo))*h;
  const pts = cl.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  const up = cl[cl.length-1] >= cl[0];
  const col = up ? '#ff4d4f' : '#3fb950';
  const area = `0,${h} ${pts} ${w},${h}`;
  const lastY = Y(cl[cl.length-1]).toFixed(1);
  return `<svg id="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polygon points="${area}" fill="${col}" opacity="0.10"/>
    <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
    <line x1="0" y1="${lastY}" x2="${w}" y2="${lastY}" stroke="${col}" stroke-width="0.7" stroke-dasharray="3 3" opacity="0.5"/>
  </svg>`;
}

/* ── 7899 取数 ── */
function httpJson(url){
  return new Promise((res,rej)=>{
    const t = setTimeout(()=>rej(new Error('超时')), 9000);
    fetch(url).then(r=>r.text()).then(txt=>{
      clearTimeout(t);
      try{ res(JSON.parse(txt)); }catch(e){ rej(new Error('返回非 JSON')); }
    }).catch(e=>{ clearTimeout(t); rej(e); });
  });
}
async function fetchKline(code, days=90){
  if(S.kline[code]) return S.kline[code];
  const url = `${BASE}/?cmd=vals&t=${encodeURIComponent('日k:'+code)}&json=1`;
  let rows = await httpJson(url);
  if(!Array.isArray(rows) || !rows.length){
    // 退而求其次：取当年通配
    const y = String(META.tradeDate).slice(0,4);
    rows = await httpJson(`${BASE}/?cmd=vals&t=${encodeURIComponent('日k:'+code+':'+y+'*')}&json=1`);
  }
  if(!Array.isArray(rows)) rows=[];
  rows = rows.filter(r=>r&&r.c).sort((a,b)=>a.date-b.date);
  const out = rows.slice(-days);
  S.kline[code]=out;
  return out;
}

/* ── 实时重算（在浏览器里跑一遍筛选，验证结果集） ── */
async function recomputeLive(){
  setMsg('正在从 7899 拉取全市场近 130 交易日日K…');
  const dot = document.getElementById('dot');
  try{
    const t0 = Date.now();
    // 1) 标的池
    const codesObj = await httpJson(`${BASE}/?cmd=get&t=${encodeURIComponent('股票代码')}&json=1`);
    const delisted = new Set(await httpJson(`${BASE}/?cmd=vals&t=${encodeURIComponent('退市*')}&json=1`) || []);
    let pool = [];
    for(const p of Object.keys(codesObj)) for(const c of codesObj[p]) pool.push(c);
    pool = pool.filter(c=>!delisted.has(c)).filter(isStockFast);
    // 2) 日历
    const keys = await httpJson(`${BASE}/?cmd=keys&t=${encodeURIComponent('日k:000001:*')}&json=1`);
    const cal = keys.map(k=>k.split(':')[2]).sort().slice(-130);
    const tdate = cal[cal.length-1];
    setMsg(`股票池 ${pool.length} 只 · 交易日 ${cal.length} 天（至 ${tdate}）· 分片抓取中…`);

    // 3) 分片抓取：交易日 × 代码片(50)
    const CHUNK=50, CONC=6, tasks=[];
    for(let i=0;i<pool.length;i+=CHUNK) tasks.push(pool.slice(i,i+CHUNK));
    const all={};
    let cur=0, done=0;
    const total = cal.length*tasks.length;
    async function worker(){
      while(true){
        const idx = cur++;
        if(idx>=total) return;
        const dk = Math.floor(idx/tasks.length), sk = idx%tasks.length;
        try{
          const arr = await httpJson(`${BASE}/?cmd=vals&t=${encodeURIComponent('日k:'+tasks[sk].join(',')+':'+cal[dk])}&json=1`);
          if(Array.isArray(arr)) for(const r of arr){ (all[r.code]=all[r.code]||[]).push(r); }
        }catch(e){}
        done++;
        if(done%3600===0) setMsg(`抓取 ${done}/${total} …`);
      }
    }
    await Promise.all(Array.from({length:CONC},worker));

    // 4) 跑筛选（与 screen.js 同口径）
    const hits = runScreen(all);
    S.live = hits;
    setMsg(`实时重算完成：条件① ${hits.filter(r=>r.tags.includes('C1')).length} · 条件② ${hits.filter(r=>r.tags.includes('C2')).length} · 条件③ ${hits.filter(r=>r.tags.includes('C3')).length} · 合计 ${hits.length} 只（${((Date.now()-t0)/1000).toFixed(1)}s）`,'ok');
    dot.className='dot on';
    render();
  }catch(e){
    setMsg('实时重算失败：'+e.message+'（请确认 stockdb.exe 在运行）','err');
    dot.className='dot off';
  }
}

/* 与 screen.js 保持一致的筛选口径（浏览器端精简版） */
function isStockFast(code){
  if(/^(159|16[0-9]|18[0-9]|50[0-9]|51[0-9]|52[0-9]|55[0-9]|56[0-9]|58[0-9]|11[0-9]|12[0-9]|204|9[0-9]{5})/.test(code)) return false;
  return /^(60[0135]|688|000|001|002|003|300|301|430|83[0-9]|87[0-9]|92[0-9])/.test(code);
}
function chipOf(rows, win=90){
  const end=rows.length-1, price=rows[end].c; if(!price) return null;
  const start=Math.max(0,end-win+1), span=end-start+1;
  let sV=0,sVP=0,sVP2=0,cV=0;
  for(let i=start;i<=end;i++){
    const r=rows[i], age=end-i, decay=span>1?1-(age/span)*0.6:1, v=(r.volume||0)*decay;
    if(v<=0) continue;
    const tp = (r.high&&r.low&&r.close)?(r.high+r.low+r.close)/3:r.close;
    sV+=v; sVP+=v*tp; sVP2+=v*tp*tp; if(tp<=price) cV+=v;
  }
  if(sV<=0) return null;
  const avg=sVP/sV, varr=Math.max(0,sVP2/sV-avg*avg);
  return {chip:cV/sV*100, conc: avg>0?1-Math.sqrt(varr)/avg:0};
}
function runScreen(all){
  const codes=Object.keys(all), out=new Map();
  const isST = r => r.is_st===true || r.is_st===1;
  const luTh = c => /^(30|68)/.test(c)?19.5 : /^(4|8|92)/.test(c)?29.5 : 9.8;
  const isLU = (c,r)=>{ if(r.pre_close&&r.close){const p=(r.close-r.pre_close)/r.pre_close*100;
    return p>=luTh(c)-0.3 || (isST(r)&&p>=4.7);} return false; };
  const put=(code,h)=>{
    if(!out.has(code)) out.set(code,{code,name:h.name,close:h.close,date:h.date,tags:[],chip:0,fmv亿:null});
    const o=out.get(code); if(!o.tags.includes(h.tag)) o.tags.push(h.tag);
    o.chip=Math.max(o.chip,h.chip);
  };
  const turn=[];
  for(const code of codes){
    const rows=(all[code]||[]).filter(r=>r&&r.close).sort((a,b)=>a.date-b.date);
    if(rows.length<60) continue;
    const n=rows.length, last=rows[n-1];
    // C1
    if(!isST(last)){
      let ok=true;
      for(let i=n-3;i<n;i++){ const r=rows[i],p=rows[i-1];
        if(!r||!p||r.close<=p.close||isLU(code,r)){ok=false;break;} }
      if(ok){
        const first=rows[n-3], g=(last.close-first.pre_close)/first.pre_close*100;
        const pc=chipOf(rows);
        if(g<=7 && pc && pc.chip>=70)
          put(code,{tag:'C1',name:last.name,close:last.close,date:last.date,chip:+pc.chip.toFixed(1)});
      }
    }
    // C2 候补
    if(!isST(last)) turn.push({code,s:(last.turnover||0)+(rows[n-2]?.turnover||0),last});
    // C3
    if(!isST(last) && n>30){
      let cnt=0; for(let i=Math.max(0,n-90);i<n;i++) if(isLU(code,rows[i])) cnt++;
      if(cnt>=3){ const pc=chipOf(rows);
        if(pc&&pc.chip>=80) put(code,{tag:'C3',name:last.name,close:last.close,date:last.date,chip:+pc.chip.toFixed(1)}); }
    }
  }
  turn.sort((a,b)=>b.s-a.s);
  for(const it of turn.slice(0,100)){
    const rows=(all[it.code]||[]).filter(r=>r&&r.close).sort((a,b)=>a.date-b.date);
    const pc=chipOf(rows);
    if(pc&&pc.chip>=70){
      put(it.code,{tag:'C2',name:it.last.name,close:it.last.close,date:it.last.date,chip:+pc.chip.toFixed(1)});
      const o=out.get(it.code); o.turnover2=+it.s.toFixed(2);
    }
  }
  // 打分
  const res=[];
  for(const o of out.values()){
    const rows=(all[o.code]||[]).filter(r=>r&&r.close).sort((a,b)=>a.date-b.date);
    const n=rows.length, win=rows.slice(-20), cl=win.map(r=>r.close);
    const mx=Math.max(...cl), mn=Math.min(...cl), band=(mx-mn)/mn*100;
    const vols=win.map(r=>r.volume||0);
    const vR=vols.slice(-5).reduce((a,b)=>a+b,0)/5, vB=vols.reduce((a,b)=>a+b,0)/vols.length;
    const vs=vB>0?vR/vB:1;
    const ma5=cl.slice(-5).reduce((a,b)=>a+b,0)/5, ma10=cl.slice(-10).reduce((a,b)=>a+b,0)/10,
          ma20=cl.reduce((a,b)=>a+b,0)/20;
    const ms=(Math.max(ma5,ma10,ma20)-Math.min(ma5,ma10,ma20))/ma20*100;
    let ws=0; if(band<25) ws+=22*(1-band/25); if(vs<1) ws+=22*Math.min(1,(1-vs)/0.45); if(ms<5) ws+=26*(1-ms/5);
    ws=Math.round(ws);
    const act=Math.min(100,((o.turnover2||0)/60)*100);
    const score=+(ws*0.50 + Math.round(Math.min(100,Math.max(0,(( (chipOf(rows)?.conc||0)-0.8)/0.2)*100)))*0.25 + o.chip*0.15 + act*0.10).toFixed(1);
    res.push({...o,score,washScore:ws,turnover2:o.turnover2??null,toRank:null,limitUps:null,gain3:null});
  }
  res.sort((a,b)=>b.tags.length-a.tags.length||b.score-a.score);
  return res;
}

document.getElementById('reloadBtn').addEventListener('click',()=>{
  if(S.source==='live'){ S.live=null; recomputeLive(); }
  else { S.kline={}; render(); setMsg('已重载离线结果集。','ok'); }
});
document.getElementById('srcSeg').addEventListener('click',e=>{
  const b=e.target.closest('button[data-src]'); if(!b) return;
  S.source=b.dataset.src;
  document.querySelectorAll('#srcSeg button').forEach(x=>x.classList.toggle('on',x===b));
  if(S.source==='live' && !S.live) recomputeLive(); else { setMsg(''); render(); }
});
document.getElementById('csvBtn').addEventListener('click',()=>{
  const rows=S.rows; if(!rows.length){ setMsg('无数据可导出。','err'); return; }
  const head=['代码','名称','收盘','共振','综合分','洗盘形态','获利筹码%','3日累涨%','2日换手%','换手排名','90日涨停','流通市值亿'];
  const esc=v=>{const s=v==null?'':String(v); return /[,"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  const lines=[head.join(',')];
  for(const r of rows) lines.push([r.code,r.name,r.close,r.tags.join('+'),r.score,r.washScore,r.chip,r.gain3,r.turnover2,r.toRank,r.limitUps,r.fmv亿].map(esc).join(','));
  const blob=new Blob(['\ufeff'+lines.join('\r\n')+'\r\n'],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`主力洗盘策略_${META.tradeDate}.csv`; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),0);
  setMsg('已导出 CSV。','ok');
});
